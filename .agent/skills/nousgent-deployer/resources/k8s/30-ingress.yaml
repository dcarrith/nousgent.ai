apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nousgent-ingress
  namespace: dbrain
  labels:
    app.kubernetes.io/name: nousgent
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dbrain
    cert-manager.io/private-key-algorithm: "ECDSA"
    cert-manager.io/private-key-size: "384"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "256k"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-prefer-server-ciphers: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "63072000"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - nousgent.ai
      secretName: nousgent-tls-cert
    - hosts:
        - www.nousgent.ai
      secretName: www-nousgent-tls-cert
    - hosts:
        - ia.nousgent.ai
      secretName: ia-nousgent-tls-cert
  rules:
    - host: nousgent.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nousgent-web
                port:
                  number: 80
    - host: www.nousgent.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nousgent-web
                port:
                  number: 80
    - host: ia.nousgent.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nousgent-web
                port:
                  number: 80
