apiVersion: v1
kind: Service
metadata:
  name: nousgent-web
  namespace: dbrain
  labels:
    app.kubernetes.io/name: nousgent
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nousgent
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: nousgent-web-headless
  namespace: dbrain
  labels:
    app.kubernetes.io/name: nousgent
    app.kubernetes.io/component: headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: nousgent
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
