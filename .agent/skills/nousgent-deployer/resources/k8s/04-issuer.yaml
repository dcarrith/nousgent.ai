apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dbrain
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: security@dbrain.to
    privateKeySecretRef:
      name: letsencrypt-dbrain-key
    solvers:
      - http01:
          ingress:
            class: nginx
