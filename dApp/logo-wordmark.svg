<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 104" width="560" height="104" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">NOUSGENT.AI — Collective Bounded RSI</title>
  <desc id="logoDesc">NOUSGENT wordmark uniting the sculpted persona crest and 5-lobe connectome for the Morphic Intelligence Field on Chia.</desc>
  <defs>
    <radialGradient id="cacaoGlow" cx="56" cy="52" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7ed957" stop-opacity="0.26"/>
      <stop offset="60%" stop-color="#2dd4bf" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#120a07" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="560" height="104" rx="22" fill="#120a07" stroke="#4a3025" stroke-width="1.5"/>
  <circle cx="56" cy="52" r="42" fill="url(#cacaoGlow)"/>

  <!-- Symmetric 1:1 Connectome Halo -->
  <circle cx="56" cy="55" r="33" fill="none" stroke="#2dd4bf" stroke-opacity="0.48" stroke-width="1.35" stroke-dasharray="4 3"/>
  <circle cx="56" cy="55" r="27" fill="none" stroke="#7ed957" stroke-opacity="0.35" stroke-width="1.05"/>

  <!-- Balanced Twin Inward-Curving Horns -->
  <path d="M 40 32 C 25 25, 27 12, 46 12 C 37 16, 37 24, 48 30 Z" fill="#23130d" stroke="#7ed957" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M 72 32 C 87 25, 85 12, 66 12 C 75 16, 75 24, 64 30 Z" fill="#9e633c" stroke="#c88a58" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Centered Circular Bipartite Persona Disk -->
  <path d="M 56 27 A 28 28 0 0 0 56 83 Z" fill="#1c100b" fill-opacity="0.95"/>
  <path d="M 56 27 A 28 28 0 0 1 56 83 Z" fill="#3b2115" fill-opacity="0.95"/>
  <circle cx="56" cy="55" r="28" fill="none" stroke="#c88a58" stroke-width="2"/>
  <circle cx="56" cy="55" r="24.4" fill="none" stroke="#f5ebe4" stroke-width="2" stroke-dasharray="3.4 3.4"/>
  <circle cx="56" cy="55" r="24.4" fill="none" stroke="#7ed957" stroke-width="2" stroke-dasharray="3.4 3.4" stroke-dashoffset="3.4"/>

  <!-- Brow & Nose Spine -->
  <path d="M 37 48 Q 46.5 39.5 56 46.5 Q 65.5 39.5 75 48" fill="none" stroke="#c88a58" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="56" y1="33" x2="56" y2="63" stroke="#c88a58" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Symmetric Ringed Eyes -->
  <circle cx="44.8" cy="53" r="6" fill="#120a07" stroke="#f5ebe4" stroke-width="1.6"/>
  <circle cx="44.8" cy="53" r="3.4" fill="none" stroke="#7ed957" stroke-width="1.6"/>
  <circle cx="44.8" cy="53" r="1.4" fill="#2dd4bf"/>
  <circle cx="67.2" cy="53" r="6" fill="#120a07" stroke="#f5ebe4" stroke-width="1.6"/>
  <circle cx="67.2" cy="53" r="3.4" fill="none" stroke="#2dd4bf" stroke-width="1.6"/>
  <circle cx="67.2" cy="53" r="1.4" fill="#7ed957"/>

  <!-- Geometric Mouth -->
  <rect x="44.5" y="67" width="23" height="7.6" rx="1.6" fill="#120a07" stroke="#c88a58" stroke-width="1.4"/>
  <line x1="50.2" y1="68.2" x2="50.2" y2="73.4" stroke="#7ed957" stroke-width="1.6"/>
  <line x1="56" y1="68.2" x2="56" y2="73.4" stroke="#2dd4bf" stroke-width="1.6"/>
  <line x1="61.8" y1="68.2" x2="61.8" y2="73.4" stroke="#7ed957" stroke-width="1.6"/>

  <!-- Un-stretched Space Grotesk Wordmark & Subtitle -->
  <text x="110" y="50" fill="#f5ebe4" font-family="Space Grotesk, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="32" font-weight="700" letter-spacing="0.8">NOUSGENT<tspan fill="#7ed957">.AI</tspan></text>
  <text x="110" y="75" fill="#c7b2a3" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="0.9">MORPHIC FIELD · COLLECTIVE BOUNDED RSI ON CHIA</text>
</svg>
