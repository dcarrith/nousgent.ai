apiVersion: 1
datasources:
  - name: Prometheus
    uid: DS_PROMETHEUS
    type: prometheus
    access: proxy
    url: http://nousgent-prometheus.dbrain.svc.cluster.local:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
      manageAlerts: true

  - name: Alertmanager
    uid: DS_ALERTMANAGER
    type: alertmanager
    access: proxy
    url: http://nousgent-alertmanager.dbrain.svc.cluster.local:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
