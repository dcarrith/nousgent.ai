apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nousgent-web
  namespace: dbrain
  labels:
    app.kubernetes.io/name: nousgent
    app.kubernetes.io/component: web
    app.kubernetes.io/version: "1.14.0"
spec:
  serviceName: nousgent-web-headless
  replicas: 2
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: nousgent
      app.kubernetes.io/component: web
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3000"
      labels:
        app.kubernetes.io/name: nousgent
        app.kubernetes.io/component: web
        app.kubernetes.io/version: "1.14.0"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nousgent-web:1.14.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NOUSGENT_POD_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: nousgent-config
            - secretRef:
                name: nousgent-secrets
          volumeMounts:
            - name: nousgent-data
              mountPath: /var/lib/nousgent
            - name: tmp-dir
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 3000m
              memory: 2048Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 8
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 4
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: tmp-dir
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: nousgent-data
        labels:
          app.kubernetes.io/name: nousgent
          app.kubernetes.io/component: web
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
