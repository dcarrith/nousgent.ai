apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nousgent-web-hpa
  namespace: dbrain
  labels:
    app.kubernetes.io/name: nousgent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: nousgent-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
