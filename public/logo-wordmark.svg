<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 104" width="580" height="104" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">NOUSGENT.AI — Collective Bounded RSI</title>
  <desc id="logoDesc">NOUSGENT wordmark uniting the sculpted persona mask and 5-lobe connectome for the Morphic Intelligence Field on Chia.</desc>
  <defs>
    <radialGradient id="cacaoGlow" cx="56" cy="52" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7ed957" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#2dd4bf" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#120a07" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="580" height="104" rx="22" fill="#120a07" stroke="#4a3025" stroke-width="1.5"/>
  <circle cx="58" cy="54" r="44" fill="url(#cacaoGlow)"/>

  <!-- 5-Lobe Connectome Halo -->
  <ellipse cx="58" cy="58" rx="36" ry="28" fill="none" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="4 3"/>
  <ellipse cx="58" cy="58" rx="29" ry="22" fill="none" stroke="#7ed957" stroke-opacity="0.4" stroke-width="1.1"/>

  <!-- Twin Inward-Curving Horns -->
  <path d="M 44 33 C 28 24, 28 10, 49 8 C 38 13, 38 23, 51 31 Z" fill="#23130d" stroke="#7ed957" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M 72 33 C 88 24, 88 10, 67 8 C 78 13, 78 23, 65 31 Z" fill="#9e633c" stroke="#c88a58" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M 49 8 Q 58 4 67 8" fill="none" stroke="#2dd4bf" stroke-opacity="0.75" stroke-width="1.2" stroke-dasharray="2 2"/>

  <!-- Bipartite Persona Disk -->
  <path d="M 58 29 A 28 28 0 0 0 58 85 Z" fill="#1c100b" fill-opacity="0.9"/>
  <path d="M 58 29 A 28 28 0 0 1 58 85 Z" fill="#3b2115" fill-opacity="0.9"/>
  <circle cx="58" cy="57" r="28" fill="none" stroke="#c88a58" stroke-width="2"/>
  <circle cx="58" cy="57" r="24.5" fill="none" stroke="#f5ebe4" stroke-width="2.2" stroke-dasharray="3.4 3.4"/>
  <circle cx="58" cy="57" r="24.5" fill="none" stroke="#7ed957" stroke-width="2.2" stroke-dasharray="3.4 3.4" stroke-dashoffset="3.4"/>

  <!-- Brow & Nose Spine -->
  <path d="M 38 50 Q 48 41 58 49 Q 68 41 78 50" fill="none" stroke="#c88a58" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="58" y1="34" x2="58" y2="65" stroke="#c88a58" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 36 58 L 43 62 L 41 70" fill="none" stroke="#7ed957" stroke-opacity="0.7" stroke-width="1.1"/>
  <path d="M 80 58 L 73 62 L 75 70" fill="none" stroke="#2dd4bf" stroke-opacity="0.7" stroke-width="1.1"/>

  <!-- Ringed Eyes -->
  <circle cx="46.5" cy="55" r="6.2" fill="#120a07" stroke="#f5ebe4" stroke-width="1.6"/>
  <circle cx="46.5" cy="55" r="3.6" fill="none" stroke="#7ed957" stroke-width="1.6"/>
  <circle cx="46.5" cy="55" r="1.4" fill="#2dd4bf"/>
  <circle cx="69.5" cy="55" r="6.2" fill="#120a07" stroke="#f5ebe4" stroke-width="1.6"/>
  <circle cx="69.5" cy="55" r="3.6" fill="none" stroke="#2dd4bf" stroke-width="1.6"/>
  <circle cx="69.5" cy="55" r="1.4" fill="#7ed957"/>

  <!-- Rectangular Mouth -->
  <rect x="46" y="69" width="24" height="8" rx="1.6" fill="#120a07" stroke="#c88a58" stroke-width="1.4"/>
  <line x1="50" y1="70.2" x2="50" y2="75.8" stroke="#f5ebe4" stroke-width="1.6"/>
  <line x1="54" y1="70.2" x2="54" y2="75.8" stroke="#7ed957" stroke-width="1.6"/>
  <line x1="58" y1="70.2" x2="58" y2="75.8" stroke="#2dd4bf" stroke-width="1.6"/>
  <line x1="62" y1="70.2" x2="62" y2="75.8" stroke="#7ed957" stroke-width="1.6"/>
  <line x1="66" y1="70.2" x2="66" y2="75.8" stroke="#f5ebe4" stroke-width="1.6"/>

  <!-- Clean Wordmark & Subtitle -->
  <text x="114" y="50" fill="#f5ebe4" font-family="Syne, Space Grotesk, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="31" font-weight="800" letter-spacing="0.5">NOUSGENT<tspan fill="#7ed957">.AI</tspan></text>
  <text x="114" y="75" fill="#c7b2a3" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="0.9">MORPHIC FIELD · COLLECTIVE BOUNDED RSI ON CHIA</text>
</svg>
