  <line x1="32" y1="21" x2="32" y2="41" stroke="#c88a58" stroke-width="2" stroke-linecap="round"/>
  <!-- Protruding Tubular Ringed Eyes -->
  <circle cx="24.5" cy="34.5" r="4.3" fill="#120a07" stroke="#f5ebe4" stroke-width="1.4"/>
  <circle cx="24.5" cy="34.5" r="2.1" fill="#7ed957"/>
  <circle cx="39.5" cy="34.5" r="4.3" fill="#120a07" stroke="#f5ebe4" stroke-width="1.4"/>
  <circle cx="39.5" cy="34.5" r="2.1" fill="#2dd4bf"/>
  <!-- Carved Rectangular Toothed Mouth -->
  <rect x="24" y="44" width="16" height="5.5" rx="1.2" fill="#120a07" stroke="#c88a58" stroke-width="1.2"/>
  <line x1="27.2" y1="44.8" x2="27.2" y2="48.7" stroke="#f5ebe4" stroke-width="1.3"/>
  <line x1="30.4" y1="44.8" x2="30.4" y2="48.7" stroke="#7ed957" stroke-width="1.3"/>
  <line x1="33.6" y1="44.8" x2="33.6" y2="48.7" stroke="#2dd4bf" stroke-width="1.3"/>
  <line x1="36.8" y1="44.8" x2="36.8" y2="48.7" stroke="#f5ebe4" stroke-width="1.3"/>
