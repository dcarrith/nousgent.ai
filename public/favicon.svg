<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="NOUSGENT">
  <title>NOUSGENT</title>
  <rect width="64" height="64" rx="15" fill="#120a07" stroke="#4a3025" stroke-width="1.5"/>
  <!-- Subtle @cbrain/core Neural Halo Behind Mask -->
  <ellipse cx="32" cy="36" rx="23" ry="19" fill="none" stroke="#2dd4bf" stroke-opacity="0.42" stroke-width="1.2" stroke-dasharray="3 2"/>
  <!-- Twin Inward-Curving Sculpted Horns -->
  <path d="M 23 20 C 13 14, 13 6, 26 5 C 19 8, 19 14, 27 19 Z" fill="#23130d" stroke="#7ed957" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M 41 20 C 51 14, 51 6, 38 5 C 45 8, 45 14, 37 19 Z" fill="#9e633c" stroke="#c88a58" stroke-width="1.3" stroke-linejoin="round"/>
